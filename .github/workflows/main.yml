name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller python-docx lxml

    - name: Build EXE (GUI)
      run: |
        pyinstaller --onefile --windowed --name Word格式检查修复工具 word_fixer.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Word格式检查修复工具
        path: dist/Word格式检查修复工具.exe
